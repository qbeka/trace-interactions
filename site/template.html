<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace</title>
<meta name="description" content="Find the part where it broke">
<link rel="preload" href="./fonts/GeistSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/Geist-Medium.woff2" as="font" type="font/woff2" crossorigin>
<!--PRELOAD-->
<style>/*STYLES*/</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="quiet back" href="https://www.qendrimbeka.com/">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>
    <nav aria-label="More about Trace">
      <a class="quiet" href="#details">Details</a>
      <a class="quiet" href="https://github.com/qbeka/trace-interactions">GitHub</a>
    </nav>
  </header>

  <main>
    <header class="title">
      <h1>Trace</h1>
      <p>Find the part where it broke</p>
    </header>

    <section class="stage" id="stage" aria-label="Recorded replay of a panel that opens in the wrong place">
      <div class="modes" id="modes" role="group" aria-label="Which run to show">
        <button class="control" type="button" data-mode="original" aria-pressed="true">Before</button>
        <button class="control" type="button" data-mode="reduced" aria-pressed="false">Show the four steps</button>
        <button class="control" type="button" data-mode="fixed" aria-pressed="false">Fixed</button>
      </div>
      <button class="control" id="geometry" type="button" aria-pressed="false">Geometry</button>

      <div class="panes" id="panes">
        <figure class="pane" id="pane-top">
          <figcaption><span class="build" id="label-top"></span><span class="note" id="note-top"></span></figcaption>
          <div class="view"><canvas role="img"></canvas><svg class="overlay" aria-hidden="true"></svg></div>
        </figure>
        <figure class="pane" id="pane-bottom">
          <figcaption><span class="build" id="label-bottom"></span><span class="note" id="note-bottom"></span></figcaption>
          <div class="view"><canvas role="img"></canvas><svg class="overlay" aria-hidden="true"></svg></div>
        </figure>
        <noscript><p class="prose">The replay needs JavaScript. The details below still work.</p></noscript>
      </div>

      <div class="verdict" id="verdict"></div>

      <div class="transport">
        <button class="control primary swap" id="play" type="button">
          <span class="on" data-label="replay">Replay</span>
          <span data-label="play">Play</span>
          <span data-label="pause">Pause</span>
        </button>
        <div class="lane" id="lane">
          <div class="ticks" id="ticks" aria-hidden="true"><i class="done" id="done"></i></div>
          <input id="time" type="range" min="0" step="16" value="0" aria-label="Time in the recording">
        </div>
        <span class="clock" id="clock"></span>
        <span class="tag">Recorded replay</span>
        <button class="control outline" id="jump" type="button">Go to the jump</button>
      </div>

      <aside class="rail" id="rail" aria-label="Steps in this run">
        <header><span id="rail-title"></span><span id="rail-count"></span></header>
        <div class="grid">
          <ol class="steps" id="steps"></ol>
          <svg class="attempts" id="attempts" viewBox="0 0 26 14" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <footer id="rail-key"></footer>
      </aside>
    </section>

    <section class="reading" id="details" aria-labelledby="details-title">
      <h2 id="details-title">Details</h2>
      <!--DETAILS-->
    </section>

    <div class="page-end">
      <a class="quiet back" href="https://www.qendrimbeka.com/">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </a>
      <a class="quiet" href="https://github.com/qbeka/trace-interactions">GitHub</a>
    </div>
  </main>
</div>
<div class="sr-only" id="status" role="status"></div>
<script id="trace-data" type="application/json">/*DATA*/</script>
<script>/*SCRIPT*/</script>
</body>
</html>
