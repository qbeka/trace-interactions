<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace</title>
<meta name="description" content="Find the part where it broke">
<link rel="preload" href="./fonts/GeistSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/Geist-Medium.woff2" as="font" type="font/woff2" crossorigin>
<!--PRELOAD-->
<style>/*STYLES*/</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="quiet back" href="https://www.qendrimbeka.com/">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>
    <nav aria-label="More about Trace">
      <a class="quiet" href="#details">Details</a>
      <a class="quiet" href="https://github.com/qbeka/trace-interactions">GitHub</a>
    </nav>
  </header>

  <main>
    <header class="title">
      <h1>Trace</h1>
      <a class="control outline" href="regression/">Open the full report</a>
      <p>Find the part where it broke</p>
    </header>

    <section class="stage" id="stage" data-view="overlay" aria-label="Recorded replay of a panel that opens in the wrong place">
      <div class="bar">
        <div class="seg" id="views" role="group" aria-label="How to compare the two builds">
          <button class="control" type="button" data-view="overlay" aria-pressed="true">Overlay</button>
          <button class="control" type="button" data-view="swipe" aria-pressed="false">Swipe</button>
          <button class="control" type="button" data-view="difference" aria-pressed="false">Difference</button>
          <button class="control" type="button" data-view="geometry" aria-pressed="false">Geometry</button>
        </div>
        <span class="source" id="source"></span>
      </div>

      <figure class="viewer" id="viewer">
        <canvas id="screen" role="img"></canvas>
        <canvas id="glow" aria-hidden="true"></canvas>
        <i class="tint" aria-hidden="true"></i>
        <svg class="marks" id="marks" aria-hidden="true"></svg>
        <div class="wipe" id="divider" role="slider" tabindex="0" aria-label="Divider between the last good build and the broken build" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-orientation="horizontal"><i></i></div>
        <figcaption class="legend" id="legend" aria-hidden="true">
          <span class="chip good"><i></i>Last good build</span>
          <span class="chip bad"><i></i>Broken build</span>
        </figcaption>
        <span class="readout" id="readout" aria-hidden="true"></span>
        <noscript><p class="prose">The replay needs JavaScript. The details below still work.</p></noscript>
      </figure>

      <div class="verdict" id="verdict"></div>

      <aside class="rail" id="rail" aria-label="The steps, and how Trace reduced them">
        <header>
          <div class="seg" id="sessions" role="group" aria-label="Which session to play">
            <button class="control" type="button" data-session="original" aria-pressed="true">All 14 steps</button>
            <button class="control" type="button" data-session="reduced" aria-pressed="false">The 4 that matter</button>
          </div>
          <button class="control icon" id="reduce-play" type="button" aria-label="Replay the reduction" title="Replay the reduction">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 8a4.8 4.8 0 1 0 1.5-3.5M3 2.6v2.6h2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </header>
        <div class="matrix" id="matrix">
          <div class="axis" aria-hidden="true"><span id="axis-count"></span></div>
          <ol class="steps" id="steps"></ol>
          <svg class="attempts" id="attempts" aria-hidden="true"></svg>
          <input id="attempt" type="range" min="0" step="1" aria-label="Attempt in the reduction">
        </div>
        <p class="attempt-note" id="attempt-note"></p>
        <footer>
          <div class="keys" id="keys" aria-hidden="true">
            <span><i class="k-fails"></i>Failure kept</span>
            <span><i class="k-passes"></i>Failure lost</span>
            <span><i class="k-invalid"></i>Could not run</span>
            <span><i class="k-other"></i>A different failure</span>
          </div>
          <button class="control outline swap" id="copy" type="button">
            <span class="on" data-label="idle">Copy the four steps</span>
            <span data-label="done">Copied as a scenario</span>
            <span data-label="failed">Could not copy</span>
          </button>
        </footer>
      </aside>

      <div class="film" id="film" aria-hidden="true">
        <div class="track"><div class="reel" id="reel"></div></div>
        <i class="needle"></i>
        <p class="now" id="now"></p>
        <p class="hint"><kbd>←</kbd><kbd>→</kbd> frame <kbd>[</kbd><kbd>]</kbd> step <kbd>F</kbd> jump <kbd>Space</kbd> play</p>
      </div>

      <div class="transport">
        <button class="control primary swap" id="play" type="button" aria-keyshortcuts="Space">
          <span class="on" data-label="replay">Replay</span>
          <span data-label="play">Play</span>
          <span data-label="pause">Pause</span>
        </button>
        <div class="lane" id="lane">
          <svg class="scope" id="scope" aria-hidden="true" preserveAspectRatio="none"></svg>
          <input id="time" type="range" min="0" step="16" value="0" aria-label="Time in the recording">
        </div>
        <span class="clock" id="clock"></span>
        <span class="tag">Recorded replay</span>
        <button class="control outline" id="jump" type="button" aria-keyshortcuts="F">Go to the jump</button>
      </div>
    </section>

    <section class="reading" id="details" aria-labelledby="details-title">
      <h2 id="details-title">Details</h2>
      <!--DETAILS-->
    </section>

    <div class="page-end">
      <a class="quiet back" href="https://www.qendrimbeka.com/">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </a>
      <a class="quiet" href="https://github.com/qbeka/trace-interactions">GitHub</a>
    </div>
  </main>
</div>
<div class="sr-only" id="status" role="status"></div>
<script id="trace-data" type="application/json">/*DATA*/</script>
<script>/*SCRIPT*/</script>
</body>
</html>
